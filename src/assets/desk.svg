<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800">
	<filter id="walnut" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
		<!-- Broad figure: slow light and dark bands. -->
		<feTurbulence type="fractalNoise" baseFrequency="0.001 0.006" numOctaves="2" seed="8" stitchTiles="stitch" result="figure" />
		<!-- Grain lines: thin creases running across the desk. -->
		<feTurbulence type="turbulence" baseFrequency="0.0025 0.22" numOctaves="2" seed="21" stitchTiles="stitch" result="grain" />
		<!-- Pores. -->
		<feTurbulence type="fractalNoise" baseFrequency="0.02 0.9" numOctaves="1" seed="5" stitchTiles="stitch" result="pores" />
		<feComposite in="figure" in2="grain" operator="arithmetic" k1="0" k2="0.5" k3="0.5" k4="0" result="wood" />
		<feComposite in="wood" in2="pores" operator="arithmetic" k1="0" k2="0.85" k3="0.15" k4="0" />
		<!-- Map the grey noise onto dark walnut. -->
		<feColorMatrix type="matrix" values="
			0.55 0 0 0 0.04
			0.39 0 0 0 0.025
			0.27 0 0 0 0.018
			0    0 0 0 1" />
	</filter>
	<rect width="100%" height="100%" filter="url(#walnut)" />
</svg>
